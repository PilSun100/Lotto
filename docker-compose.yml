services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lotto
      POSTGRES_USER: lotto
      POSTGRES_PASSWORD: lotto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotto -d lotto"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: lotto
      POSTGRES_USER: lotto
      POSTGRES_PASSWORD: lotto
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
